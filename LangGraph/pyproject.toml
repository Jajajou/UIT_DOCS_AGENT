[project]
name = "agent"
version = "0.3.2"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.46.3,<4.48",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "psycopg2-binary>=2.9.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pytesseract>=0.3.10",
    "langchain-text-splitters>=0.3.0",
    "langchain>=0.3.0",
    "pdf2image>=1.16.0",
    "requests>=2.31.0",
    "addict>=2.4.0",
    "matplotlib>=3.7.0",
    "einops>=0.7.0",
    "easydict>=1.13.0",
    "lightrag-hku>=0.0.1",
    "flagembedding>=1.3.5",
    "dateparser>=1.4.0",
    "underthesea>=9.4.0",
    "apscheduler>=3.11.2",
    "rank-bm25>=0.2.2",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.2.8",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:Support for class-based `config` is deprecated:pydantic.PydanticDeprecatedSince20",
    "ignore:Pydantic V1 style `@validator` validators are deprecated:pydantic.PydanticDeprecatedSince20",
    "ignore:The `dict` method is deprecated:pydantic.PydanticDeprecatedSince20",
]
