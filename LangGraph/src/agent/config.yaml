# LangGraph/src/agent/config.yaml

# DeepSeek OCR Configuration
deepseek_ocr:
  model_name: "mlx-community/DeepSeek-OCR-8bit"
  model_configs:
    Gundam: {base_size: 1024, image_size: 640, crop_mode: True}
    Tiny: {base_size: 512, image_size: 512, crop_mode: False}
    Small: {base_size: 640, image_size: 640, crop_mode: False}
    Base: {base_size: 1024, image_size: 1024, crop_mode: False}
    Large: {base_size: 1280, image_size: 1280, crop_mode: False}
  task_prompts:
    Markdown: {prompt: "<|grounding|>Convert the document to markdown.", has_grounding: True}
    Free OCR: {prompt: "Free OCR.", has_grounding: False}
    Locate: {prompt: "Locate <|ref|>text<|/ref|> in the image.", has_grounding: True}
    Describe: {prompt: "Describe this image in detail.", has_grounding: False}
    Custom: {prompt: "", has_grounding: False}
  skip_repeat: True

# Query Confidence Thresholds
query_thresholds:
  query_confidence_threshold: 0.5
  overall_confidence_threshold: 0.7
  fallback_confidence_threshold: 0.4

# Default Retrieval Parameters
retrieval:
  default_mode: "mix"
  default_top_k: 8
  default_chunk_top_k: 16

# Reranker Configuration
reranker:
  default_model: "namdp-ptit/ViRanker"
  top_n_for_confidence: 5
  use_fp16: True
  batch_size: 8
  normalize_scores: True
  max_length: 512

# Temporal Document Management Configuration
temporal:
  # Enable temporal awareness features
  enabled: true

  # Recency bias weight in reranking (0.0 = no bias, 1.0 = only recency)
  # Research shows 0.3 weight achieves optimal balance
  recency_weight: 0.3

  # Document freshness thresholds
  freshness_thresholds:
    warning_days: 30      # Warn if document expires within 30 days
    critical_days: 0      # Critical if already expired

  # Data quality penalties for expired content
  quality_penalties:
    expired_penalty: 0.5       # Multiply quality score by 0.5 if expired
    expiring_soon_penalty: 0.8 # Multiply by 0.8 if expiring within warning_days
    amended_penalty: 0.7       # Multiply by 0.7 if document has been amended by newer version

  # Version management
  versioning:
    strategy: "soft_delete"  # Options: "soft_delete", "hard_delete", "keep_all"
    retention_days: 1825     # Keep historical versions for 5 years (for cohort queries)

  # Validity period extraction (used by temporal extraction agent)
  date_extraction:
    enabled: true
    # Vietnamese date patterns are defined in agent code
    # Confidence thresholds
    min_confidence_for_auto_archive: 0.7  # Only auto-archive if extraction confidence >= 0.7
