# LangGraph/src/agent/config.yaml

# MinerU OCR Configuration
mineru_ocr:
  model_name: "opendatalab/MinerU2.5-Pro-2605-1.2B"
  skip_repeat: True
  # Remote OCR service URL (official MinerU Docker on 3060, reachable via Tailscale).
  # Set to null to run OCR locally on Mac (MLX).
  api_url: "http://localhost:8080"       # Vast.ai tunnel (mineru-api), see reference_mineru_deploy_live memory
  vlm_server_url: null  # null = use hybrid-auto-engine on server GPU (no separate vllm needed)

# Query Confidence Thresholds
query_thresholds:
  query_confidence_threshold: 0.5
  overall_confidence_threshold: 0.7
  fallback_confidence_threshold: 0.4

# Default Retrieval Parameters
retrieval:
  default_mode: "mix"
  default_top_k: 8
  default_chunk_top_k: 16

# Reranker Configuration
reranker:
  default_model: "AITeamVN/Vietnamese_Reranker"
  top_n_for_confidence: 5
  use_fp16: True
  batch_size: 8
  normalize_scores: True
  max_length: 512

# Temporal Document Management Configuration
temporal:
  # Enable temporal awareness features
  enabled: true

  # Recency bias weight in reranking (0.0 = no bias, 1.0 = only recency)
  # Research shows 0.3 weight achieves optimal balance
  recency_weight: 0.3

  # Cohort-aware reranking weights (must sum to 1.0)
  # Used when use_cohort_boost=True AND query has a cohort year
  cohort_weight: 0.25           # Weight for cohort match score (1.0/0.5/0.0)
  semantic_weight_cohort: 0.55  # Weight for semantic score in cohort mode
  temporal_weight_cohort: 0.20  # Weight for temporal freshness in cohort mode

  # Document freshness thresholds
  freshness_thresholds:
    warning_days: 30      # Warn if document expires within 30 days
    critical_days: 0      # Critical if already expired

  # Data quality penalties for expired content
  quality_penalties:
    expired_penalty: 0.5          # Multiply quality score by 0.5 if expired
    expiring_soon_penalty: 0.8    # Multiply by 0.8 if expiring within warning_days
    amended_penalty: 0.7          # Multiply by 0.7 if document has been amended by newer version
    amendment_override_score: 0.3 # Temporal score forced onto superseded docs in reranking

  # Amendment override: force a low temporal score on any item that has been
  # superseded by a newer document (amended_by field is non-empty).
  # Controlled by USE_AMENDMENT_OVERRIDE env var (default: false).
  # Note: this setting is env-var only; the YAML value here is not loaded.

  # Version management
  versioning:
    strategy: "soft_delete"  # Options: "soft_delete", "hard_delete", "keep_all"
    retention_days: 1825     # Keep historical versions for 5 years (for cohort queries)

  # Validity period extraction (used by temporal extraction agent)
  date_extraction:
    enabled: true
    # Vietnamese date patterns are defined in agent code
    # Confidence thresholds
    min_confidence_for_auto_archive: 0.7  # Only auto-archive if extraction confidence >= 0.7
