server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location /daa/ {
        try_files $uri $uri/ =404;

        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";

        types {
            application/pdf pdf;
            text/html html htm;
            text/markdown md;
        }
    }

    location = / {
        return 301 /daa/;
    }
}
