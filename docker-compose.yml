name: firecrawl-selfhosted

x-firecrawl-env: &firecrawl-env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
  NUQ_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  USE_DB_AUTHENTICATION: false
  BULL_AUTH_KEY: ${BULL_AUTH_KEY:-CHANGEME}
  LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}

services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
    networks:
      - firecrawl-network
    restart: unless-stopped

  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    environment:
      <<: *firecrawl-env
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
    depends_on:
      - redis
      - postgres
      - playwright-service
    ports:
      - "3002:3002"
    networks:
      - firecrawl-network
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker

  redis:
    image: redis:alpine
    networks:
      - firecrawl-network
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0

  postgres:
    build: ../firecrawl/apps/nuq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - firecrawl-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  crawler:
    build: .
    container_name: firecrawl-uit-crawler
    environment:
      FIRECRAWL_URL: http://api:3002
      SCHEDULE_HOURS: ${SCHEDULE_HOURS:-24}
      RUN_ONCE: ${RUN_ONCE:-false}
      MAX_WORKERS: ${MAX_WORKERS:-3}
      OUTPUT_DIR: /data
      LOG_PATH: /logs/crawler.log
      CONFIG_PATH: /app/config.yaml
      SEED_URLS: ${SEED_URLS}
      INCLUDE_PATTERNS: ${INCLUDE_PATTERNS}
      EXCLUDE_PATTERNS: ${EXCLUDE_PATTERNS}
      MAX_DEPTH: ${MAX_DEPTH:-3}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - api
    networks:
      - firecrawl-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  firecrawl-network:
    driver: bridge
