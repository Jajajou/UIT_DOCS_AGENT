services:
# LightRAG for document knowledge base
  lightrag_uit:
    container_name: lightrag_uit
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: LightRAG
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    env_file: .env.lightrag
    ports: ["9622:9621"]
    depends_on:
      postgres_uit:
        condition: service_started
      qdrant_uit:
        condition: service_started
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/tiktoken:/app/data/tiktoken
      - ./LightRAG/lightrag/prompt.py:/app/lightrag/prompt.py:ro
      - ./LightRAG/lightrag/llm/openai.py:/app/lightrag/llm/openai.py:ro
    environment:
      - TIKTOKEN_CACHE_DIR_DOC=./data/tiktoken
    networks:
      - uit_network
    # restart: unless-stopped
    
  postgres_uit:
    image: pgvector/pgvector:pg16
    env_file: .env.lightrag
    ports: ["5433:5432"]
    environment: 
      POSTGRES_DB: lightrag
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
    networks:
      - uit_network

  qdrant_uit:
    image: qdrant/qdrant:latest
    ports:
      - "6336:6333"
      - "6337:6334"
    volumes:
      - ./data/qdrant_data_v2:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3\""]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
    networks:
      - uit_network

networks:
  uit_network:
    name: uit_network
