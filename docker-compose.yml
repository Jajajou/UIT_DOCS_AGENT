services:
  # ============================================
  # LightRAG - Document Knowledge Base
  # ============================================
  lightrag_uit:
    container_name: lightrag_uit
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: LightRAG
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    env_file: .env.lightrag
    ports: ["9622:9621"]
    volumes:
      - ./data/rag_storage:/app/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/tiktoken:/app/data/tiktoken
      - ./LightRAG/.log:/app/logs
    environment:
      - TIKTOKEN_CACHE_DIR=/app/data/tiktoken
      - RAG_DIR=/app/rag_storage
    restart: unless-stopped
    networks:
      - uit_network

  # ============================================
  # LangGraph - Agent Orchestration
  # ============================================
  langgraph_uit:
    container_name: langgraph_uit
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    env_file: LangGraph/.env
    ports: ["8123:8123"]
    volumes:
      - ./LangGraph/src:/app/src
      - ./data:/app/data
    environment:
      - LIGHTRAG_URL=http://lightrag_uit:9621
    depends_on:
      - lightrag_uit
    restart: unless-stopped
    networks:
      - uit_network

networks:
  uit_network:
    driver: bridge