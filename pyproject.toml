[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-docs-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "addict>=2.4.0",
    "chromadb>=1.5.7",
    "dateparser>=1.4.0",
    "einops>=0.8.1",
    "fastapi>=0.135.3",
    "flagembedding>=1.3.5",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.6",
    "langgraph-api>=0.7.100",
    "langgraph-cli[inmem]>=0.4.21",
    "lightrag-hku[api]",
    "matplotlib>=3.10.7",
    "mlx-vlm[torch]",
    "nltk>=3.9.2",
    "numpy>=2.4.4",
    "ollama>=0.6.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.13.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.15.1",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.0",
    "torch>=2.11.0",
    "transformers",
    "underthesea>=9.4.0",
    "unidecode>=1.4.0",
    "uvicorn>=0.44.0",
]

[tool.uv.workspace]
members = [
    "LightRAG",
]

[tool.uv.sources]
lightrag-hku = { workspace = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
executionEnvironments = [ {root = ".", extraPaths = ["LightRAG", "LangGraph/src",]} ]

[dependency-groups]
dev = [
    "img2pdf>=0.6.1",
    "ipykernel>=7.1.0",
    "pymupdf>=1.26.5",
    "pypdf2>=3.0.1",
    "tabulate>=0.9.0",
]

[tool.setuptools.package-dir]
"" = "LangGraph/src"

[tool.setuptools.packages.find]
where = ["LangGraph/src"]
